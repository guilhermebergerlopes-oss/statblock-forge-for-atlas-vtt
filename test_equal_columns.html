<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="styles.css"><style>body{font-family:Arial;background:white;color:black;padding:16px}.statblock-forge__preview-scores{width:640px;border:1px solid red}.statblock-forge__preview-score-table{width:100%;max-width:100%;margin:0.15rem 0 0;border-collapse:separate;border-spacing:0;font-size:12px}.statblock-forge__preview-score-table th,.statblock-forge__preview-score-table td{padding:.35rem .5rem;border-bottom:1px solid #ccc;text-align:left;vertical-align:top}.statblock-forge__preview-score-table>thead>tr>th{border-top:1px solid #ccc;background:#eee}</style></head><body><div class="statblock-forge__preview-scores"><table id="t" class="statblock-forge__preview-score-table statblock-forge__preview-table-grid is-editable"><colgroup><col class="statblock-forge__preview-table-row-label-column" style="width:calc((100% - 2.1rem) / 5)"><col class="statblock-forge__preview-table-column statblock-forge__preview-table-column--counters" style="width:calc((100% - 2.1rem) / 5)"><col class="statblock-forge__preview-table-column statblock-forge__preview-table-column--number" style="width:calc((100% - 2.1rem) / 5)"><col class="statblock-forge__preview-table-column statblock-forge__preview-table-column--rating" style="width:calc((100% - 2.1rem) / 5)"><col class="statblock-forge__preview-table-column statblock-forge__preview-table-column--text" style="width:calc((100% - 2.1rem) / 5)"><col class="statblock-forge__preview-table-row-actions-column" style="width:2.1rem"></colgroup><thead><tr><th>Row</th><th>Counter</th><th>Number</th><th>Rating</th><th>Text</th><th class="statblock-forge__preview-table-row-actions-heading"></th></tr></thead><tbody><tr><th class="statblock-forge__preview-table-row-label">Label</th><td class="statblock-forge__preview-table-cell statblock-forge__preview-table-cell--counters">Counter control content very long</td><td class="statblock-forge__preview-table-cell statblock-forge__preview-table-cell--number">123456789012345</td><td class="statblock-forge__preview-table-cell statblock-forge__preview-table-cell--rating">4/5</td><td class="statblock-forge__preview-table-cell statblock-forge__preview-table-cell--text">Text content</td><td class="statblock-forge__preview-table-row-actions-cell"><button>×</button></td></tr></tbody></table></div><script>const t=document.querySelector('#t');t.style.width='max(100%, 47.1rem)';t.style.minWidth='47.1rem';t.style.maxWidth='none';t.style.tableLayout='fixed';setTimeout(()=>{console.log([...t.querySelectorAll('col')].map(c=>[c.className,c.getBoundingClientRect().width,getComputedStyle(c).width]));console.log([...t.querySelectorAll('th,td')].map(c=>[c.className,c.getBoundingClientRect().width,getComputedStyle(c).width]));},100)</script></body></html>
